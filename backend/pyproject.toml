[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-sakti-backend"
version = "1.0.0"
description = "AI-Powered Legal, Patent & Compliance Core for Ayush Formulations (SIH26045)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "IP-SAKTI Sahayak Team", email = "dev@ipsakti.ayush.gov.in" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "SQLAlchemy>=2.0.31",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "alembic>=1.13.2",
    "google-generativeai>=0.7.2",
    "langchain>=0.2.7",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scipy>=1.13.1",
    "PyMuPDF>=1.24.7",
    "pdfplumber>=0.11.2",
    "reportlab>=4.2.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.1",
    "mypy>=1.10.1"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
